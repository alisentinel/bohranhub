name: Build and deploy to ArvanCloud object storage

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.ARVAN_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
      AWS_ENDPOINT: ${{ secrets.ARVAN_ENDPOINT }}
      BUCKET: ${{ github.ref == 'refs/heads/main' && secrets.ARVAN_BUCKET || secrets.ARVAN_BUCKET_DEV }}

    steps:
      - uses: actions/checkout@v4

      - name: Build minified site
        run: ./build.sh

      # Assets change rarely -> cache a day. index.html/data.json are the content -> keep them fresh.
      - name: Upload assets
        run: |
          aws s3 sync dist/ s3://$BUCKET/ --endpoint-url $AWS_ENDPOINT \
            --delete --acl public-read \
            --exclude index.html --exclude data.json \
            --cache-control "public, max-age=86400"

      - name: Upload content
        run: |
          aws s3 sync dist/ s3://$BUCKET/ --endpoint-url $AWS_ENDPOINT \
            --acl public-read \
            --exclude "*" --include index.html --include data.json \
            --cache-control "public, max-age=300"
